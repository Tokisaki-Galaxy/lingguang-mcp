name: publish

# 推一个形如 v0.1.0 的 tag 就自动发布到 PyPI。
# 用 Trusted Publishing，不需要任何 API token。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  test:
    name: 跑测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run pytest -q

  build:
    name: 构建分发包
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: 校验 tag 格式
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag 必须形如 v1.2.3，当前是 ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "版本号由 tag 决定：${VERSION}"
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: 发布到 PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lingguang
    permissions:
      # Trusted Publishing 必需
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: 上传到 PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  release:
    name: 创建 GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 生成 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes "**PyPI**: https://pypi.org/project/lingguang/${VERSION}/

          **安装或升级**:

          \`\`\`bash
          uv tool install lingguang
          uv tool upgrade lingguang
          \`\`\`"
