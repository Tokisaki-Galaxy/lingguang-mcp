[project]
name = "lingguang-mcp"
version = "0.1.0"
description = "灵光 AI 的 MCP 与 CLI 工具：替 Agent 发问、取回结论、记录执行轨迹"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    "requests>=2.32",
    "mcp>=1.2.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
lingguang = "lingguang.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lingguang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: 需要真实 cookie 的契约测试，默认跳过",
]
addopts = "-m 'not live'"
