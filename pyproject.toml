[project]
name = "lingguang"
dynamic = ["version"]
description = "把灵光 AI 的支付宝账单查询等功能封装成 MCP 工具和 CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tokisaki-galaxy" }]
keywords = ["mcp", "lingguang", "alipay", "dingtalk", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Utilities",
    "Typing :: Typed",
]

dependencies = [
    "requests>=2.32",
    "mcp>=1.2.0",
    "typer>=0.12",
    # Windows 下用系统凭据管理器存 cookie，平台条件依赖，其他系统不装
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/Tokisaki-Galaxy/lingguang-mcp"
Repository = "https://github.com/Tokisaki-Galaxy/lingguang-mcp"
Issues = "https://github.com/Tokisaki-Galaxy/lingguang-mcp/issues"
Documentation = "https://github.com/Tokisaki-Galaxy/lingguang-mcp#readme"
Changelog = "https://github.com/Tokisaki-Galaxy/lingguang-mcp/releases"

[project.scripts]
lingguang = "lingguang.cli.main:app"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/lingguang/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lingguang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: 需要真实 cookie 的契约测试，默认跳过",
]
addopts = "-m 'not live'"
